# DEV 배포 (develop → :dev). PROD 배포(deploy.yml, main → :latest)는 별도·무손상.
# 방식: 기존과 동일한 raw docker run(compose 아님). PROD 와 컨테이너 이름/호스트포트/nginx vhost 로 완전 분리.
#
# ⚠️ 서버 사전작업(수동): nginx dev.oclyx.com → nextjs-oklyx-front-dev:3000 (ydmins_proxy_network) + 인증서.
# ⚠️ GitHub Secrets: 신규 API_URL_DEV (예: https://api-dev.oclyx.com) 필요 — 빌드시 이미지에 baked.
#     나머지(SERVER_HOST/SERVER_USER/SSH_PRIVATE_KEY/TAILSCALE_AUTH_KEY/CR_PAT)는 기존 재사용.

name: Deploy nextjs-oklyx-front to DEV

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/ydmins/nextjs-oklyx-front

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.CR_PAT }}

      - name: Build and push Docker image (:dev)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev
            ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SERVER_API_URL=${{ secrets.API_URL_DEV }}

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}

      - name: Deploy DEV to server via SSH
        uses: appleboy/ssh-action@master
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          CR_PAT: ${{ secrets.CR_PAT }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GITHUB_ACTOR,CR_PAT,IMAGE_NAME
          script: |
            # Log in to GitHub Container Registry
            echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Stop and remove old DEV container
            docker stop nextjs-oklyx-front-dev || true
            docker rm nextjs-oklyx-front-dev || true

            # Pull :dev image
            docker pull "$IMAGE_NAME:dev"

            # Ensure required networks exist (idempotent)
            docker network inspect pms_network >/dev/null 2>&1 || docker network create pms_network
            docker network inspect ydmins_proxy_network >/dev/null 2>&1 || docker network create ydmins_proxy_network

            # DEV 컨테이너: PROD 와 호스트포트(3001 vs 3000)·이름으로 분리
            docker run -d \
              --name nextjs-oklyx-front-dev \
              -p 3001:3000 \
              --network pms_network \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              "$IMAGE_NAME:dev"

            # Attach to reverse-proxy network (dev.oclyx.com)
            docker network connect ydmins_proxy_network nextjs-oklyx-front-dev

            # Log out from registry
            docker logout ghcr.io

            # Wait and health check
            sleep 5
            curl -f http://localhost:3001/ || exit 1

            echo "DEV deploy (nextjs-oklyx-front:dev) completed"
